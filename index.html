<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedski Gestion</title>
<meta name="theme-color" content="#F2ECD6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B191A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speedski">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Devis, bons de commande, factures, achats de véhicules et réparations pour VV Passion Speedski.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<style>
/* Layout : une colonne pensée pour le téléphone (max 760px), barre d'onglets en bas, éditeur plein écran. */
:root {
  --page: #F2ECD6;
  --paper: #FBF7EA;
  --sunk: #EAE2C8;
  --ink: #0A1819;
  --ink-2: #4E5C58;
  --ink-3: #7C8A85;
  --line: #D9D0B3;
  --red: #870000;
  --red-ink: #870000;
  --on-red: #F8F2DF;
  --rose: #C97573;
  --lake: #507F89;
  --sage: #758A83;
  --teal: #0D2F31;
  --ok: #2E6A4D;
  --ok-bg: #DCE8D9;
  --warn: #9A5A0C;
  --warn-bg: #F3E2BF;
  --muted-bg: #E6E0CB;
  --t-facture: #870000;
  --t-devis: #507F89;
  --t-commande: #4D6B64;
  --t-achat: #0D2F31;
  --t-reparation: #B05B57;
  --shadow: 0 1px 0 rgba(10,24,25,.06), 0 8px 24px -16px rgba(10,24,25,.35);
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'Barlow', -apple-system, 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
  --r: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0B191A; --paper: #12272A; --sunk: #0A1617; --ink: #F2ECD6; --ink-2: #A9B7B0; --ink-3: #7F918B; --line: #24403F;
    --red: #A3150C; --red-ink: #FF8E7E; --on-red: #FCF1E7; --rose: #D98E8B; --lake: #86B1BB; --sage: #97AAA3; --teal: #1E4A4D;
    --ok: #8FD0AE; --ok-bg: #173A2C; --warn: #F2BE6E; --warn-bg: #3A2B12; --muted-bg: #1C3335;
    --t-facture: #A3150C; --t-devis: #3F6F79; --t-commande: #46655E; --t-achat: #24585B; --t-reparation: #A45450;
    --shadow: 0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0B191A; --paper: #12272A; --sunk: #0A1617; --ink: #F2ECD6; --ink-2: #A9B7B0; --ink-3: #7F918B; --line: #24403F;
  --red: #A3150C; --red-ink: #FF8E7E; --on-red: #FCF1E7; --rose: #D98E8B; --lake: #86B1BB; --sage: #97AAA3; --teal: #1E4A4D;
  --ok: #8FD0AE; --ok-bg: #173A2C; --warn: #F2BE6E; --warn-bg: #3A2B12; --muted-bg: #1C3335;
  --t-facture: #A3150C; --t-devis: #3F6F79; --t-commande: #46655E; --t-achat: #24585B; --t-reparation: #A45450;
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--page); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--lake); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Accueil ---------- */
.hero { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.hero img.hero-img { display: block; width: 100%; aspect-ratio: 1200 / 700; object-fit: cover; object-position: 50% 0; max-width: 100%; }
@media (min-width: 760px) { .hero { margin-inline: 0; margin-top: 16px; } .hero img.hero-img { border-radius: 20px; } }
.hero-badge { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: -30px; width: 76px; height: 76px; border-radius: 50%; background: var(--page); padding: 4px; box-shadow: var(--shadow); }
@media (min-width: 760px) { .hero-badge { left: 18px; } }
.hero-badge img { width: 100%; height: 100%; display: block; }
.hello { padding: 40px 0 4px; display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.hello h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.hello p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }

.section-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.section-title a, .section-title button.link { font-family: var(--font-body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--red-ink); text-decoration: none; background: none; border: 0; padding: 0; }

.create { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.create button { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 14px; text-align: left; display: grid; gap: 10px; min-height: 108px; align-content: space-between; box-shadow: var(--shadow); transition: transform .12s ease; }
.create button:active { transform: scale(.98); }
.create button b { font-weight: 700; font-size: 17px; line-height: 1.15; display: block; }
.create button small { color: var(--ink-2); font-size: 13px; display: block; margin-top: 2px; line-height: 1.3; }
.create button.primary { grid-column: 1 / -1; background: var(--red); color: var(--on-red); border-color: transparent; grid-template-columns: auto 1fr auto; align-items: center; min-height: 0; padding: 16px; }
.create button.primary small { color: color-mix(in srgb, var(--on-red) 78%, transparent); }
.create button.primary .ticon { background: color-mix(in srgb, var(--on-red) 16%, transparent); }
.create .go { width: 22px; height: 22px; opacity: .8; }

.ticon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #F8F2DF; flex: none; }
.ticon svg { width: 22px; height: 22px; }
.ticon.sm { width: 38px; height: 38px; border-radius: 10px; }
.ticon.sm svg { width: 20px; height: 20px; }
.t-facture { background: var(--t-facture); }
.t-devis { background: var(--t-devis); }
.t-commande { background: var(--t-commande); }
.t-achat { background: var(--t-achat); }
.t-reparation { background: var(--t-reparation); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.stat.due .v { color: var(--red-ink); }
@media (max-width: 420px) { .stats { grid-template-columns: 1fr 1fr; } .stat.due { grid-column: 1 / -1; } }

.banner { margin-top: 16px; border-radius: var(--r); padding: 12px 14px; background: var(--warn-bg); color: var(--ink); display: flex; gap: 12px; align-items: center; font-size: 14.5px; }
.banner b { color: var(--warn); }
.banner button { margin-left: auto; flex: none; }

/* ---------- Listes ---------- */
.list { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; min-width: 0; }
.row:first-child { border-top: 0; }
.row:active { background: var(--sunk); }
.row .main { flex: 1; min-width: 0; }
.row .l1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row .no { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; white-space: nowrap; }
.row .who { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--ink-2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { flex: none; display: grid; justify-items: end; gap: 5px; }
.row .amt { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15.5px; white-space: nowrap; }
.row .date { color: var(--ink-3); font-size: 13px; }
.month { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 20px 2px 8px; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--muted-bg); color: var(--ink-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.red { background: color-mix(in srgb, var(--red-ink) 14%, transparent); color: var(--red-ink); }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-2); background: var(--paper); border: 1px dashed var(--line); border-radius: var(--r); }
.empty img { width: 64px; height: 64px; opacity: .9; }
.empty h3 { margin: 10px 0 4px; color: var(--ink); font-size: 17px; }
.empty p { margin: 0 auto; max-width: 34ch; font-size: 14.5px; }

.pagehead { padding: 22px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pagehead h1 { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 32px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.search { position: relative; margin-top: 10px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); padding: 0 14px 0 40px; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; margin-inline: -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }

/* ---------- Boutons ---------- */
.btn { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; font-size: 15.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn svg { width: 19px; height: 19px; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--page); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--red-ink); }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
a.btn { text-decoration: none; color: var(--ink); }
a.btn.primary { color: var(--on-red); }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:active { background: var(--sunk); }

/* ---------- Barre d'onglets ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabbar nav { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--ink-3); text-decoration: none; font-size: 11.5px; font-weight: 600; border-radius: 10px; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--red-ink); }

/* ---------- Formulaires ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 12px; }
.card > h2, .card summary h2 { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 12px; }
.card details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card details > summary::-webkit-details-marker { display: none; }
.card details > summary h2 { margin: 0; }
.card details > summary .sum { color: var(--ink-3); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; text-align: right; }
.card details > summary .chev { width: 20px; height: 20px; color: var(--ink-3); transition: transform .2s; flex: none; }
.card details[open] > summary .chev { transform: rotate(180deg); }
.card details[open] > summary { margin-bottom: 12px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid .full { grid-column: 1 / -1; }
@media (max-width: 380px) { .grid.r2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); padding: 10px 12px; font-size: 16px; min-width: 0; }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.field input[type="date"], .field input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 46px; }
.field select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.field .hint { font-size: 12.5px; color: var(--ink-3); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--lake); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lake) 25%, transparent); }
.field input.upper { text-transform: uppercase; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); font-weight: 600; font-size: 14.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 6px 0; }
.switch input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked { background: var(--red); }
.switch input:checked::after { transform: translateX(20px); }
.switch .t b { display: block; font-weight: 600; }
.switch .t small { color: var(--ink-3); font-size: 13px; }

/* ---------- Éditeur ---------- */
.editor { position: fixed; inset: 0; z-index: 40; background: var(--page); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.ed-top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.ed-top .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.ed-top .ttl { flex: 1; min-width: 0; text-align: center; }
.ed-top .ttl b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-top .ttl small { color: var(--ink-3); font-size: 12.5px; }
.ed-body { max-width: 760px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ed-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ed-bottom .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.ed-bottom .tot { flex: 1; min-width: 0; }
.ed-bottom .tot small { display: block; color: var(--ink-3); font-size: 12.5px; }
.ed-bottom .tot b { font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.doc-id { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.doc-id .ticon { width: 48px; height: 48px; border-radius: 13px; }
.doc-id .ticon svg { width: 26px; height: 26px; }
.doc-id h1 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.doc-id .no { color: var(--red-ink); font-weight: 700; font-family: var(--font-display); font-size: 17px; }

.suggest { position: relative; }
.suggest-list { position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.suggest-list button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; border-top: 1px solid var(--line); }
.suggest-list button:first-child { border-top: 0; }
.suggest-list button small { display: block; color: var(--ink-3); font-size: 13px; }

.lines { display: grid; gap: 10px; }
.line { border: 1px solid var(--line); border-radius: 12px; background: var(--page); padding: 12px; display: grid; gap: 10px; }
.line .lh { display: flex; align-items: center; gap: 8px; }
.line .kind { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); flex: 1; }
.line .kind.reprise { color: var(--warn); }
.line .lh .iconbtn { width: 34px; height: 34px; margin: -6px -6px -6px 0; }
.line .lgrid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 8px; align-items: end; }
.line .lgrid.no-vat { grid-template-columns: minmax(0, .8fr) minmax(0, 1.6fr); }
.line .lamt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13.5px; color: var(--ink-3); }
.line .lamt b { color: var(--ink); font-size: 16.5px; font-variant-numeric: tabular-nums; }
.line .field input, .line .field select, .line .field textarea { background: var(--paper); }
.line .field textarea { min-height: 46px; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  pdf.text(T.title, ML, ty, { font: 'B', size: titleSize, color: INK });
  ty += 7;
  pdf.text(`N° ${number}`, ML, ty, { font: 'B', size: 11, color: RED });
  ty += 7;
  const meta = [];
  if (doc.type === 'achat') meta.push(['Date de cession', fmtDate(doc.date, true) + (doc.time ? ` à ${doc.time.replace(':', 'h')}` : '')]);
  else meta.push(['Date', fmtDate(doc.date, true)]);
  if (doc.type === 'devis' && doc.validUntil) meta.push(['Valable jusqu’au', fmtDate(doc.validUntil, true)]);
  if (isInvoice && doc.dueDate) meta.push(['Échéance', fmtDate(doc.dueDate, true)]);
  if (doc.type === 'commande' && doc.deliveryDate) meta.push(['Livraison prévue', fmtDate(doc.deliveryDate, true)]);
  if (doc.ref) meta.push(['Référence', doc.ref]);
  if (doc.type === 'achat' && doc.cessionNo) meta.push(['Certificat de cession', doc.cessionNo]);
  for (const [k, v] of meta) {
    pdf.text(k, ML, ty, { size: 8.4, color: MUTED });
    const vl = wrap(v, 'B', 9, 58);
    vl.forEach((t, i) => pdf.text(t, ML + 33, ty + i * 4.2, { font: 'B', size: 9, color: INK }));
    ty += 4.9 + (vl.length - 1) * 4.2;
  }
  // Bloc client / vendeur
  const cl = doc.client || {};
  const cx = 120, cwid = MR - cx;
  let cy = 72 - 3.6;
  pdf.text(T.partyPdf, cx, cy, { font: 'B', size: 7.4, color: SAGE, cs: 1 });
  cy += 6.4;
  const nameLines = wrap(cl.name || '—', 'B', 11.5, cwid);
  nameLines.forEach((t) => { pdf.text(t, cx, cy, { font: 'B', size: 11.5, color: INK }); cy += 5.2; });
  const clLines = [];
  if (cl.company && cl.company !== cl.name) clLines.push(cl.company);
  if (cl.address) clLines.push(...String(cl.address).split(/\n/));
  const zc = [cl.zip, cl.city].filter(Boolean).join(' ');
  if (zc) clLines.push(zc);
  if (cl.phone) clLines.push('Tél. ' + cl.phone);
  if (cl.email) clLines.push(cl.email);
  if (cl.vatNo) clLines.push('TVA : ' + cl.vatNo);
  if (doc.type === 'achat' && cl.idDoc) clLines.push('Pièce d’identité : ' + cl.idDoc);
  for (const l of clLines) for (const t of wrap(l, 'R', 9.2, cwid)) { pdf.text(t, cx, cy, { size: 9.2, color: INK }); cy += 4.4; }
  y = Math.max(ty, cy) + 4;

  // Véhicule
  const v = doc.vehicle || {};
  if (hasVehicle(v)) {
    const fields = VEHICLE_FIELDS.filter(([k]) => k !== 'modele' && v[k] && String(v[k]).trim());
    const cols = 4, colW = (CW - 10) / cols;
    const rows = Math.ceil(fields.length / cols);
    const modelLines = v.modele ? wrap(v.modele, 'B', 11, CW - 10) : [];
    const h = 7.5 + modelLines.length * 5 + rows * 9.4 + 2;
    pdf.rect(ML, y, CW, h, { fill: PANEL, r: 2 });
    let vy = y + 5.6;
    pdf.text('VÉHICULE', ML + 5, vy, { font: 'B', size: 7.4, color: SAGE, cs: 1 });
    vy += 5.6;
    modelLines.forEach((t) => { pdf.text(t, ML + 5, vy, { font: 'B', size: 11, color: INK }); vy += 5; });
    if (modelLines.length) vy += 0.6;
    fields.forEach(([k, label], i) => {
      const fx = ML + 5 + (i % cols) * colW, fy = vy + Math.floor(i / cols) * 9.4;
      pdf.text(label, fx, fy, { size: 7.2, color: MUTED });
      let val = String(v[k]);
      if (k === 'km') val = fmtNum(val) + ' km';
      if (k === 'mec') val = /^\d{4}-\d{2}-\d{2}$/.test(val) ? fmtDate(val) : val;
      if (k === 'cv' && /^\d+$/.test(val)) val += ' CV';
      if (k === 'immat') val = val.toUpperCase();
      const vt = wrap(val, 'B', 9.2, colW - 3)[0] || '';
      pdf.text(vt, fx, fy + 4.4, { font: 'B', size: 9.2, color: INK });
    });
    y += h + 5;
  }

  // Tableau des lignes
  const onlyMarge = totals.hasMarge && !totals.hasNormal;
  const ht = totals.vatRows.length && !totals.hasMarge && !franchise ? ' HT' : '';
  const X = { desc: ML + 3, descW: 94, qty: 124, pu: 150, vat: 162.5, amt: MR - 3 };
  function tableHeader() {
    pdf.rect(ML, y, CW, 8, { fill: INK, r: 1.2 });
    const o = { font: 'B', size: 7.2, color: LIGHT, cs: 0.6 };
    pdf.text('DÉSIGNATION', X.desc, y + 5.2, o);
    pdf.text('QTÉ', X.qty, y + 5.2, Object.assign({ align: 'right' }, o));
    pdf.text('PRIX UNIT.' + ht, X.pu, y + 5.2, Object.assign({ align: 'right' }, o));
    pdf.text('TVA', X.vat, y + 5.2, Object.assign({ align: 'center' }, o));
    pdf.text('MONTANT' + ht, X.amt, y + 5.2, Object.assign({ align: 'right' }, o));
    y += 8;
  }
  tableHeader();
  const lines = (doc.lines || []).filter((l) => (l.label && l.label.trim()) || num(l.price));
  if (!lines.length) {
    pdf.text('Aucune ligne', X.desc, y + 6.5, { font: 'I', size: 9, color: MUTED });
    y += 10;
  }
  for (const l of lines) {
    const lab = wrap(l.label || '—', 'B', 9.4, X.descW);
    const det = l.detail ? wrap(l.detail, 'R', 8.2, X.descW) : [];
    const rh = 3.2 + lab.length * 4.4 + det.length * 3.8 + 2.6;
    if (y + rh > LIMIT) { newPage(); tableHeader(); }
    let ly = y + 6.2;
    lab.forEach((t, i) => pdf.text(t, X.desc, ly + i * 4.4, { font: 'B', size: 9.4, color: INK }));
    det.forEach((t, i) => pdf.text(t, X.desc, ly + lab.length * 4.4 - 0.4 + i * 3.8, { size: 8.2, color: MUTED }));
    const q = fmtNum(l.qty) + (l.unit ? ' ' + l.unit : '');
    pdf.text(q, X.qty, ly, { size: 9.2, color: INK, align: 'right' });
    pdf.text(fmtMoney(l.kind === 'reprise' ? -Math.abs(num(l.price)) : l.price), X.pu, ly, { size: 9.2, color: INK, align: 'right' });
    const vt = l.kind === 'reprise' ? '—' : l.vat === 'marge' ? 'Marge' : franchise ? '—' : (num(l.vat) ? fmtNum(l.vat) + ' %' : '0 %');
    pdf.text(vt, X.vat, ly, { size: 8.4, color: MUTED, align: 'center' });
    pdf.text(fmtMoney(lineAmount(l)), X.amt, ly, { font: 'B', size: 9.4, color: INK, align: 'right' });
    y += rh;
    pdf.line(ML, y, MR, y, { color: RULE, lw: 0.25 });
  }
  if (totals.hasMarge && totals.hasNormal) {
    y += 4.2;
    pdf.text('Prix HT, sauf lignes « Marge » : prix TTC, TVA sur la marge non apparente.', ML, y, { size: 7.4, color: MUTED });
  }
  y += 6;

  // Totaux (droite) + règlement (gauche)
  const tx = 122, tw = MR - tx;
  const trows = [];
  if (totals.vatRows.length && !franchise) {
    trows.push(['Total HT', fmtMoney(totals.ht)]);
    for (const r of totals.vatRows) trows.push([`TVA ${fmtNum(r.rate)} %`, fmtMoney(r.amount)]);
    if (totals.hasMarge) trows.push(['Biens d’occasion (TVA sur marge)', fmtMoney(totals.marge)]);
  } else if (totals.hasMarge && totals.hasNormal && totals.ht) {
    trows.push(['Prestations et frais', fmtMoney(totals.ht)]);
    trows.push(['Biens d’occasion (TVA sur marge)', fmtMoney(totals.marge)]);
  }
  const finalLabel = doc.type === 'achat' ? 'PRIX D’ACHAT' : (totals.vatRows.length || totals.hasMarge) && !franchise ? 'TOTAL TTC' : 'TOTAL';
  const afterRows = [];
  if (totals.reprise) afterRows.push(['Reprise de véhicule', '- ' + fmtMoney(totals.reprise)]);
  if (totals.deposit) afterRows.push(['Acompte versé', '- ' + fmtMoney(totals.deposit)]);
  const leftBlock = [];
  if (doc.payMode) leftBlock.push(['Règlement', doc.payMode]);
  if (isInvoice && doc.status === 'payee' && doc.paidDate) leftBlock.push(['Payée le', fmtDate(doc.paidDate)]);
  const showBank = (C.iban || '').trim() && (isInvoice || doc.type === 'commande') && (!doc.payMode || doc.payMode === 'Virement') && doc.status !== 'payee';
  if (showBank) { leftBlock.push(['IBAN', C.iban]); if (C.bic) leftBlock.push(['BIC', C.bic + (C.bank ? '  ·  ' + C.bank : '')]); }
  const notes = (doc.notes || '').trim();
  const noteLines = notes ? wrap(notes, 'R', 8.6, 96) : [];
  const leftH = leftBlock.length * 4.8 + (noteLines.length ? 7 + noteLines.length * 4 : 0) + (isInvoice && doc.status === 'payee' ? 21 : 0);
  const totH = trows.length * 6 + 11 + afterRows.length * 6 + (afterRows.length ? 8 : 0);
  if (y + Math.max(totH, leftH) > LIMIT) newPage();
  const ytop = y;
  let ry = y;
  for (const [k, val] of trows) {
    pdf.text(k, tx + 2, ry + 4.4, { size: 8.8, color: MUTED });
    pdf.text(val, MR - 2, ry + 4.4, { size: 9.2, color: INK, align: 'right' });
    ry += 6;
  }
  ry += 1;
  pdf.rect(tx, ry, tw, 9.4, { fill: RED, r: 1.2 });
  pdf.text(finalLabel, tx + 3, ry + 6.2, { font: 'B', size: 8.6, color: LIGHT, cs: 0.7 });
  pdf.text(fmtMoney(totals.ttc), MR - 3, ry + 6.4, { font: 'B', size: 11.5, color: LIGHT, align: 'right' });
  ry += 9.4;
  for (const [k, val] of afterRows) {
    ry += 1;
    pdf.text(k, tx + 2, ry + 4.4, { size: 8.8, color: MUTED });
    pdf.text(val, MR - 2, ry + 4.4, { size: 9.2, color: INK, align: 'right' });
    ry += 5;
  }
  if (afterRows.length) {
    pdf.line(tx, ry + 1.2, MR, ry + 1.2, { color: RULE, lw: 0.3 });
    pdf.text('Reste à payer', tx + 2, ry + 6.6, { font: 'B', size: 9.4, color: INK });
    pdf.text(fmtMoney(totals.due), MR - 2, ry + 6.6, { font: 'B', size: 10.5, color: INK, align: 'right' });
    ry += 9;
  }
  let ly = ytop + 4.4;
  for (const [k, val] of leftBlock) {
    pdf.text(k, ML, ly, { size: 8.4, color: MUTED });
    pdf.text(String(val), ML + 22, ly, { font: 'B', size: 8.8, color: INK });
    ly += 4.8;
  }
  if (noteLines.length) {
    ly += 2.2;
    pdf.text('NOTES', ML, ly, { font: 'B', size: 7.2, color: SAGE, cs: 1 });
    ly += 4.6;
    noteLines.forEach((t) => { pdf.text(t, ML, ly, { size: 8.6, color: INK }); ly += 4; });
  }
  // Tampon « PAYÉE »
  if (isInvoice && doc.status === 'payee') {
    const scx = ML + 26, scy = ly + 9;
    pdf.rotated(scx, scy, 7, () => {
      pdf.rect(-21, MiniPDF.PH - 8.5, 42, 15.5, { stroke: [178, 34, 26], lw: 0.8, r: 2 });
    });
    pdf.text('PAYÉE', scx, scy + 0.8, { font: 'B', size: 17, color: [178, 34, 26], align: 'center', angle: 7, ox: scx, oy: scy });
    if (doc.paidDate) pdf.text('le ' + fmtDate(doc.paidDate), scx, scy + 5, { font: 'B', size: 7.4, color: [178, 34, 26], align: 'center', angle: 7, ox: scx, oy: scy });
    ly += 21;
  }
  y = Math.max(ry, ly) + 5;

  // Mentions
  const mentions = [];
  const base = (doc.conditions != null ? doc.conditions : S.mentions[doc.type]) || '';
  if (base.trim()) mentions.push(base.trim());
  if (totals.hasMarge && doc.type !== 'achat') mentions.push('Régime particulier – Biens d’occasion : TVA sur la marge (art. 297 A du CGI), non récupérable par l’acheteur.');
  if (franchise && doc.type !== 'achat') mentions.push('TVA non applicable, art. 293 B du CGI.');
  if (isInvoice && (S.mentions.penalties || '').trim()) mentions.push(S.mentions.penalties.trim());
  const mLines = [];
  for (const m of mentions) { mLines.push(...wrap(m, 'R', 7.8, CW)); mLines.push(null); }
  if (mLines.length) mLines.pop();
  const mH = mLines.reduce((h, t) => h + (t === null ? 1.6 : 3.45), 0);
  if (mLines.length) {
    if (y + Math.min(mH, 12) > LIMIT) newPage();
    for (const t of mLines) {
      if (t === null) { y += 1.6; continue; }
      if (y > LIMIT) newPage();
      pdf.text(t, ML, y, { size: 7.8, color: MUTED }); y += 3.45;
    }
    y += 5;
  }

  // Signatures
  if (T.sign) {
    const bh = 32, bw = (CW - 8) / 2;
    if (y + bh + 6 > LIMIT) newPage();
    const boxes = doc.type === 'achat'
      ? [['LE VENDEUR', `« ${T.sign} »`, sigImg], ['L’ACHETEUR', [C.name, C.contact].filter(Boolean).join('  ·  '), null]]
      : [['LE CLIENT', `« ${T.sign} »`, sigImg], [doc.type === 'commande' ? 'LE VENDEUR' : 'L’ENTREPRISE', [C.name, C.contact].filter(Boolean).join('  ·  '), null]];
    boxes.forEach(([title, sub, img], i) => {
      const bx = ML + i * (bw + 8);
      pdf.rect(bx, y, bw, bh, { stroke: RULE, lw: 0.35, r: 2 });
      pdf.text(title, bx + 4, y + 5.4, { font: 'B', size: 7.2, color: SAGE, cs: 1 });
      pdf.text(sub, bx + 4, y + 9.6, { size: 8, color: MUTED });
      if (img) {
        const ih = 17, iw = Math.min(bw - 8, ih * img.w / img.h);
        pdf.image(img.name, bx + 4, y + 11.5, iw, ih);
      }
      if (i === 0 && doc.signedAt) pdf.text('Signé le ' + fmtDate(doc.signedAt), bx + bw - 4, y + bh - 3, { size: 7.2, color: MUTED, align: 'right' });
      if (i === 0 && !img) pdf.text('Date et signature', bx + bw - 4, y + bh - 3, { size: 7.2, color: RULE, align: 'right' });
    });
    y += bh + 4;
  }
  if (extra.sample) {
    pdf.text('EXEMPLE', 105, 200, { font: 'B', size: 80, color: cream ? [230, 220, 192] : [238, 236, 230], align: 'center', angle: 32, ox: 105, oy: 200 });
  }

  // Pied de page sur chaque page
  const legal1 = [C.name, [C.address, [C.zip, C.city].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join('  ·  ');
  const legal2 = [C.legal, C.siret ? 'SIRET ' + C.siret : '', C.tva ? 'TVA intracom. ' + C.tva : ''].filter(Boolean).join('  ·  ');
  const total = pdf.pages.length;
  pdf.pages.forEach((p, i) => {
    pdf.p = p;
    pdf.line(ML, 282, MR, 282, { color: RULE, lw: 0.3 });
    pdf.text(legal1, 105, 286.4, { size: 7, color: MUTED, align: 'center' });
    if (legal2) pdf.text(legal2, 105, 290, { size: 7, color: MUTED, align: 'center' });
    if (total > 1) pdf.text(`${i + 1}/${total}`, MR, 286.4, { size: 7, color: MUTED, align: 'right' });
  });
  return pdf.output({ title: `${T.title} ${number}`, author: C.name });
}

function pdfFileName(doc) {
  const T = TYPES[doc.type];
  const who = (doc.client && doc.client.name || '').replace(/[\\/:*?"<>|]+/g, '').trim();
  return `${T.label} ${doc.number || 'brouillon'}${who ? ' - ' + who : ''}.pdf`.replace(/\s+/g, ' ');
}

if (typeof module !== 'undefined') module.exports = { MiniPDF, renderDocumentPDF, pdfFileName };

    const s = sheet(`<h3>${isPdf ? 'PDF prêt' : isSheet ? 'Tableau prêt pour Numbers' : 'Sauvegarde prête'}</h3><p>${esc(name)}</p>
      <div class="stack">
        ${canShare ? `<button class="btn primary block" data-dl="share">${ic('arrow')} ${isPdf ? 'Envoyer ou enregistrer' : isSheet ? 'Envoyer au Mac ou enregistrer' : 'Enregistrer dans Fichiers'}</button>` : ''}
        ${isPdf ? `<a class="btn block" href="${url}" target="_blank" rel="noopener">${ic('docs')} Ouvrir le PDF</a>` : ''}
        <a class="btn block ${canShare ? '' : 'primary'}" href="${url}" download="${esc(name)}" data-dl="dl">${ic('pdf')} Télécharger</a>
        <button class="btn ghost block" data-dl="close">Fermer</button>
      </div>`);
    s.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-dl]'); if (!b) return;
      if (b.dataset.dl === 'close') { closeSheet(); return; }
      if (b.dataset.dl === 'dl') { setTimeout(() => toast(isPdf ? 'PDF téléchargé' : isSheet ? 'Tableau téléchargé' : okMsg), 400); return; }
      if (b.dataset.dl === 'share') {
        try { await navigator.share({ files: [file], title: name }); closeSheet(); toast(okMsg); }
        catch (err) { if (!err || err.name !== 'AbortError') toast('Le partage n’a pas fonctionné : utilisez Télécharger.'); }
      }
    });
    setTimeout(() => URL.revokeObjectURL(url), 15 * 60 * 1000);
    return true;
  }

  /* ---------- Interface ---------- */
  const UI = { route: 'accueil', filter: 'all', q: '', cq: '' };
  const ED = { doc: null, orig: '', isNew: false, suggest: false };
  const view = () => $('#view');

  let toastTimer = null;
  function toast(msg) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.toggle('in-editor', !!ED.doc);
    t.hidden = false;
    t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  function sheet(html, onMount) {
    closeSheet();
    const back = document.createElement('div');
    back.className = 'sheet-back'; back.id = 'sheet';
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', (e) => { if (e.target === back && !back.dataset.locked) closeSheet(); });
    document.body.appendChild(back);
    if (onMount) onMount(back);
    return back;
  }
  function closeSheet() { const s = $('#sheet'); if (s) { if (s._resolve) s._resolve(null); s.remove(); } }
  function ask({ title, text, ok, alt, danger, cancel }) {
    return new Promise((resolve) => {
      const s = sheet(`<h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
        <div class="row-btns"><button class="btn" data-ans="">${esc(cancel || 'Annuler')}</button>${alt ? `<button class="btn" data-ans="alt">${esc(alt)}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-ans="ok">${esc(ok || 'Confirmer')}</button></div>`);
      s._resolve = resolve;
      s.addEventListener('click', (e) => {
        const b = e.target.closest('[data-ans]'); if (!b) return;
        s._resolve = null; s.remove(); resolve(b.dataset.ans || null);
      });
    });
  }

  function statusLabel(d) {
    const T = TYPES[d.type];
    if (INVOICE_TYPES.includes(d.type) && d.status === 'apayer' && d.dueDate && d.dueDate < todayISO()) return ['En retard', 'red'];
    const st = T.statuses.find((x) => x[0] === d.status) || T.statuses[0];
    return [st[1], STATUS_TONE[st[0]] || ''];
  }
  function sortedDocs() {
    return [...S.docs.values()].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
  }
  function docRow(d) {
    const t = computeTotals(d, S.settings);
    const [sl, tone] = statusLabel(d);
    const sub = [TYPES[d.type].short, vehicleSummary(d.vehicle)].filter(Boolean).join(' · ');
    return `<button class="row" data-act="open-doc" data-id="${esc(d.id)}">
      <span class="ticon sm t-${d.type}">${ic(d.type)}</span>
      <span class="main mob"><span class="no" style="display:block">${esc(d.number || 'Brouillon')}</span>

        <span class="sub" style="display:block">${esc([sub, fmtDate(d.date)].filter(Boolean).join(' · '))}</span></span>
      <span class="right mob"><span class="amt">${fmtMoney(t.ttc)}</span><span class="pill ${tone}">${esc(sl)}</span></span>
      <span class="dsk d-no"><b>${esc(d.number || 'Brouillon')}</b><small>${esc(TYPES[d.type].label)}</small></span>
      <span class="dsk d-who"><b>${esc((d.client && d.client.name) || 'Sans nom')}</b><small>${esc((d.client && d.client.city) || '')}</small></span>
      <span class="dsk d-veh">${esc((d.vehicle && d.vehicle.modele) || '—')}<small>${esc((d.vehicle && d.vehicle.immat) || '')}</small></span>
      <span class="dsk d-date">${fmtDate(d.date)}</span>
      <span class="dsk d-st"><span class="pill ${tone}">${esc(sl)}</span></span>
      <span class="dsk d-amt">${fmtMoney(t.ttc)}</span>
    </button>`;
  }
  function docList(items) {
    return `<div class="list docs"><div class="list-head dsk"><span></span><span>N°</span><span>Client</span><span>Véhicule</span><span>Date</span><span>Statut</span><span>Montant TTC</span></div>${items.map(docRow).join('')}</div>`;
  }

  function renderTabs() {
    $$('.tabbar a').forEach((a) => a.setAttribute('aria-current', a.dataset.route === UI.route ? 'page' : 'false'));
  }
  function renderView() {
    renderTabs();
    const v = view();
    if (UI.route === 'documents') v.innerHTML = viewDocs();
    else if (UI.route === 'clients') v.innerHTML = viewClients();
    else if (UI.route === 'reglages') v.innerHTML = viewSettings();
    else v.innerHTML = viewHome();
  }

  function viewHome() {
    const docs = sortedDocs();
    const now = todayISO().slice(0, 7);
    const monthName = MONTHS[Number(now.slice(5, 7)) - 1];
    let due = 0, dueN = 0, month = 0, monthN = 0, quotes = 0, quotesN = 0;
    for (const d of docs) {
      const t = computeTotals(d, S.settings);
      if (INVOICE_TYPES.includes(d.type)) {
        if (d.status === 'apayer') { due += t.due; dueN++; }
        if ((d.date || '').startsWith(now)) { month += t.ttc; monthN++; }
      }
      if (d.type === 'devis' && d.status === 'attente') { quotes += t.ttc; quotesN++; }
    }
    const C = S.settings.company;
    const missing = !(C.siret || '').trim();
    const tiles = TYPE_ORDER.map((k) => k === 'facture'
      ? `<button class="primary" data-act="new" data-type="facture"><span class="ticon">${ic('facture')}</span><span><b>Nouvelle facture</b><small>${HINTS.facture}</small></span><svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS.arrow}</svg></button>`
      : `<button data-act="new" data-type="${k}"><span class="ticon t-${k}">${ic(k)}</span><span><b>${TYPES[k].label}</b><small>${HINTS[k]}</small></span></button>`).join('');
    return `

        <div class="hero"><img class="hero-img" src="${HERO}" alt="Van Volkswagen California rouge et crème devant un lac de montagne"><div class="hero-badge"><img src="${LOGO}" alt="Logo VV Passion Speedski"></div></div>
        <div class="hello"><div><h1>Gestion</h1><p>${esc(C.name)} · ${esc(C.city)}</p></div></div>
      </div><div class="home-create">
        ${missing ? `<div class="banner"><span><b>À compléter :</b> SIRET et n° de TVA, obligatoires sur les factures.</span><button class="btn sm" data-act="go" data-route="reglages">Réglages</button></div>` : ''}
        <div class="section-title">Créer</div>

      </div></div>

        <div class="stat"><div class="k">Facturé en ${monthName}</div><div class="v">${fmtMoney(month)}</div><div class="s">${monthN} document${monthN > 1 ? 's' : ''}</div></div>

      <p class="foot">${esc(C.name)} · ${esc(C.tagline)}</p>`;

  function filteredDocs() {
    const q = UI.q.trim().toLowerCase();
    let docs = sortedDocs();
    if (UI.filter === 'due') docs = docs.filter((d) => INVOICE_TYPES.includes(d.type) && d.status === 'apayer');
    else if (UI.filter !== 'all') docs = docs.filter((d) => d.type === UI.filter);
    if (q) docs = docs.filter((d) => [d.number, d.client && d.client.name, d.client && d.client.city, d.vehicle && d.vehicle.modele, d.vehicle && d.vehicle.immat, d.vehicle && d.vehicle.vin, ...(d.lines || []).map((l) => l.label)].filter(Boolean).join(' ').toLowerCase().includes(q));
    return docs;
  }
  function viewDocs() {
    const q = UI.q.trim().toLowerCase();
    const filters = [['all', 'Tous'], ['facture', 'Factures'], ['devis', 'Devis'], ['commande', 'Commandes'], ['achat', 'Achats'], ['reparation', 'Réparations'], ['due', 'À encaisser']];
    const docs = filteredDocs();
    let body = '';
    if (!S.docs.size) body = `<div class="empty" style="margin-top:16px"><img src="${LOGO}" alt=""><h3>Pas encore de documents</h3><p>Vos devis, bons de commande, factures, achats et réparations s’afficheront ici.</p><p style="margin-top:14px"><button class="btn primary" data-act="new" data-type="facture">${ic('plus')} Nouvelle facture</button></p></div>`;
    else if (!docs.length) body = `<div class="empty" style="margin-top:16px"><h3>Aucun résultat</h3><p>Essayez un autre nom, numéro ou immatriculation.</p></div>`;
    else {
      let cur = '';
      const groups = [];
      for (const d of docs) {
        const m = (d.date || '').slice(0, 7);
        if (m !== cur) { cur = m; groups.push({ m, items: [] }); }
        groups[groups.length - 1].items.push(d);
      }
      body = groups.map((g) => `<div class="month">${g.m ? MONTHS[Number(g.m.slice(5, 7)) - 1] + ' ' + g.m.slice(0, 4) : 'Sans date'}</div>${docList(g.items)}`).join('');

      <div class="search">${ic('search')}<input id="doc-q" type="search" placeholder="Client, numéro, immatriculation…" value="${esc(UI.q)}" autocomplete="off"></div>
      <div class="chips" role="group" aria-label="Filtrer">${filters.map(([k, l]) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${UI.filter === k}">${l}</button>`).join('')}</div>
      <div id="doc-results">${body}</div>
      ${S.docs.size ? `<button class="btn block" style="margin-top:16px" data-act="export-xlsx">${ic('docs')} Exporter la liste pour Numbers</button><p class="note" style="text-align:center">Tableau .xlsx : un document par ligne et le détail des lignes, selon le filtre choisi.</p>` : ''}`;

  function clientDocs(c) { return sortedDocs().filter((d) => d.clientId === c.id); }
  function viewClients() {
    const q = UI.cq.trim().toLowerCase();

      ? ['ok', 'Enregistré dans votre compte Claude : vos documents restent disponibles sur vos appareils connectés.']
      : S.mode === 'local'
        ? ['', IN_CLAUDE ? 'Enregistré sur cet appareil uniquement. Exportez une sauvegarde de temps en temps pour ne rien perdre.' : 'Enregistré sur ce téléphone. Exportez une sauvegarde de temps en temps, par exemple vers iCloud Drive, pour ne rien perdre en cas de changement de téléphone.']
        : ['', 'Le stockage n’est pas disponible dans cette vue : exportez une sauvegarde avant de fermer.'];
    const numRows = TYPE_ORDER.map((k) => `
      <div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.8fr);align-items:end">

    return `<div class="pagehead"><h1>Réglages</h1></div><div class="cards-2">
      <div class="card"><h2>Entreprise</h2><div class="grid r2">
        ${sField('Nom', 'company.name', { full: true })}
        ${sField('Gérant', 'company.contact', { full: true, hint: 'Affiché sous l’en-tête et dans la case de signature de l’entreprise' })}
        ${sField('Accroche', 'company.tagline', { full: true })}
        ${sField('Adresse', 'company.address', { full: true })}
        ${sField('Code postal', 'company.zip', { attrs: 'inputmode="numeric"' })}
        ${sField('Ville', 'company.city')}
        ${sField('Téléphone', 'company.phone', { attrs: 'inputmode="tel"' })}
        ${sField('E-mail', 'company.email', { attrs: 'inputmode="email" autocapitalize="off"' })}

      </div></div>
      <div class="card"><h2>Mentions légales et banque</h2><div class="grid r2">
        ${sField('SIRET', 'company.siret', { attrs: 'inputmode="numeric"' })}
        ${sField('N° TVA intracom.', 'company.tva', { attrs: 'autocapitalize="characters"' })}
        ${sField('Forme juridique, capital, RCS', 'company.legal', { full: true, hint: 'Pour une SARL : capital social et ville du RCS, indiqués sur le Kbis. Exemple : SARL au capital de 10 000 € · RCS Mulhouse 792 392 151' })}
        ${sField('IBAN', 'company.iban', { full: true, attrs: 'autocapitalize="characters"', hint: 'Affiché sur les factures et bons de commande réglés par virement' })}
        ${sField('BIC', 'company.bic', { attrs: 'autocapitalize="characters"' })}
        ${sField('Banque', 'company.bank')}

      <div class="card"><h2>PDF</h2>
        <div class="field"><span>Fond des pages</span><div class="seg"><button data-act="set" data-s="pdf.background" data-v="cream" aria-pressed="${st.pdf.background !== 'white'}">Crème, comme la carte</button><button data-act="set" data-s="pdf.background" data-v="white" aria-pressed="${st.pdf.background === 'white'}">Blanc, pour imprimer</button></div></div>
        <label class="switch" style="margin-top:10px"><span class="t"><b>Montagnes en haut de page</b><small>L’illustration de la carte de visite</small></span><input type="checkbox" data-s="pdf.illustration" ${st.pdf.illustration ? 'checked' : ''}></label>
        <button class="btn block" style="margin-top:12px" data-act="sample-pdf">${ic('pdf')} Voir un exemple de facture</button>
      </div>
      <div class="card"><h2>Valeurs par défaut</h2><div class="grid r2">
        ${sField('Taux horaire main d’œuvre HT (€)', 'defaults.hourlyRate', { attrs: 'inputmode="decimal"' })}
        <label class="field"><span>TVA des véhicules vendus</span><select data-s="defaults.vehicleVat">${[['marge', 'TVA sur marge (occasion)'], ['20', '20 %'], ['0', '0 %']].map(([v, l]) => `<option value="${v}" ${st.defaults.vehicleVat === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${sField('Validité des devis (jours)', 'defaults.devisDays', { attrs: 'inputmode="numeric"' })}
        ${sField('Échéance des factures (jours)', 'defaults.dueDays', { attrs: 'inputmode="numeric"', hint: '0 = paiement à réception' })}
      </div>
        <label class="switch" style="margin-top:10px"><span class="t"><b>Franchise de TVA</b><small>Ajoute « TVA non applicable, art. 293 B du CGI »</small></span><input type="checkbox" data-s="defaults.franchise" ${st.defaults.franchise ? 'checked' : ''}></label>

      <div class="card"><h2>Sauvegarde</h2>

  /* ---------- Documents ---------- */
  function newLine(kind, doc) {
    const D = S.settings.defaults;
    const l = { id: uid(), kind, label: '', detail: '', qty: '1', unit: '', price: '', vat: D.franchise ? '0' : '20' };
    if (kind === 'vehicule') {
      l.vat = doc.type === 'achat' ? '0' : D.vehicleVat;
      l.label = doc.type === 'achat' ? 'Achat du véhicule désigné ci-dessus' : ((doc.vehicle && doc.vehicle.modele) || '');
    }
    if (kind === 'mo') { l.label = 'Main d’œuvre'; l.unit = 'h'; l.price = String(D.hourlyRate || ''); }
    if (kind === 'reprise') { l.label = 'Reprise de votre véhicule'; l.vat = '0'; }
    if (kind === 'frais' && doc.type === 'achat') l.vat = '0';
    return l;
  }
  function newDoc(type, init) {
    const st = S.settings;
    const date = todayISO();
    const d = Object.assign({
      id: uid(), type, number: '', date, status: TYPES[type].statuses[0][0],
      client: {}, clientId: '', vehicle: {}, lines: [], deposit: '', payMode: '', notes: '', ref: '',
      conditions: st.mentions[type] || '',
    }, init || {});
    if (type === 'devis' && !d.validUntil) d.validUntil = addDaysISO(date, st.defaults.devisDays || 30);
    if (INVOICE_TYPES.includes(type) && !d.dueDate) d.dueDate = addDaysISO(date, st.defaults.dueDays || 0);
    if (!d.lines.length) {
      if (type === 'reparation') d.lines = [newLine('mo', d), newLine('piece', d)];
      else d.lines = [newLine('vehicule', d)];
    }
    if (type === 'achat' && !d.payMode) d.payMode = 'Virement';

  function sigToJpeg(dataUrl, bg) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0);
        res({ w: c.width, h: c.height, jpeg: c.toDataURL('image/jpeg', 0.9).split(',')[1] });
      };
      img.onerror = () => res(null);
      img.src = dataUrl;
    });
  }
  async function makePDF(doc, extra) {
    let signature = null;
    if (doc.signature) signature = await sigToJpeg(doc.signature, S.settings.pdf.background === 'white' ? '#FFFFFF' : '#F2ECD6');
    let bytes;
    try { bytes = renderDocumentPDF(doc, S.settings, Object.assign({ signature }, extra || {})); }
    catch (e) { console.error(e); toast('Le PDF n’a pas pu être créé.'); return; }
    await offerFile(extra && extra.sample ? 'Exemple facture Speedski.pdf' : pdfFileName(doc), new Blob([bytes], { type: 'application/pdf' }), 'PDF enregistré');
  }

  function openSignature() {
    const d = ED.doc;
    const s = sheet(`<h3>Signature ${d.type === 'achat' ? 'du vendeur' : 'du client'}</h3><p>Signez avec le doigt dans le cadre ci-dessous.</p>
      <canvas class="sig-pad" id="sigpad" aria-label="Zone de signature"></canvas><div class="sig-line"></div>
      <div class="row-btns" style="margin-top:58px"><button class="btn" data-sig="clear">Effacer</button><button class="btn" data-sig="cancel">Annuler</button><button class="btn primary" data-sig="ok">Valider</button></div>`);
    s.dataset.locked = '1';
    const cv = $('#sigpad', s);
    const ctx = cv.getContext('2d');
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const box = cv.getBoundingClientRect();
    cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
    ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0A1A2A'; ctx.lineWidth = 2.6;
    let drawing = false, last = null, inked = false;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, Math.PI * 2); ctx.fillStyle = '#0A1A2A'; ctx.fill(); inked = true; e.preventDefault(); });
    cv.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.quadraticCurveTo(last[0], last[1], p[0], p[1]); ctx.stroke();
      last = p; e.preventDefault();
    });
    const end = () => { drawing = false; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    s.addEventListener('click', (e) => {
      const b = e.target.closest('[data-sig]'); if (!b) return;
      if (b.dataset.sig === 'clear') { ctx.clearRect(0, 0, cv.width, cv.height); inked = false; return; }
      if (b.dataset.sig === 'cancel') { closeSheet(); return; }
      if (!inked) { toast('Signez d’abord dans le cadre'); return; }
      const out = document.createElement('canvas');
      out.width = 720; out.height = Math.round(720 * cv.height / cv.width);
      out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);
      ED.doc.signature = out.toDataURL('image/png');
      ED.doc.signedAt = todayISO();
      closeSheet();
      renderEditor();
    });
  }

      if (od) { const d = S.docs.get(od.dataset.id); closeSheet(); if (d) openEditor(clone(d), false); return; }
      const b = e.target.closest('[data-cact]'); if (!b) return;
      if (b.dataset.cact === 'save' || b.dataset.cact === 'new') {
        read();
        if (!c.name) { toast('Indiquez un nom'); return; }
        saveClientRec(c);
        if (b.dataset.cact === 'save') { closeSheet(); toast('Client enregistré'); renderView(); return; }
        closeSheet();
        pickType('Nouveau document pour ' + c.name, (t) => openEditor(newDoc(t, { client: { name: c.name, address: c.address, zip: c.zip, city: c.city, phone: c.phone, email: c.email, vatNo: c.vatNo, idDoc: c.idDoc }, clientId: c.id }), true));
      }
      if (b.dataset.cact === 'del') {
        closeSheet();
        const a = await ask({ title: `Supprimer ${c.name} ?`, text: 'Le client est retiré de la liste. Ses documents sont conservés.', ok: 'Supprimer', danger: true });
        if (a === 'ok') { deleteClientRec(c.id); renderView(); toast('Client supprimé'); }
      }
    });
  }

  function sampleDoc() {
    return {
      id: 'exemple', type: 'facture', number: 'FAC-' + new Date().getFullYear() + '-001', date: todayISO(), dueDate: todayISO(), status: 'apayer', payMode: 'Virement',
      client: { name: 'Client exemple', address: '1 rue de l’Exemple', zip: '68000', city: 'Colmar' },
      vehicle: { modele: 'Volkswagen T6.1 California Ocean 2.0 TDI 150 ch DSG', immat: 'AB-123-CD', km: '48500', mec: '2021-04-12', energie: 'Diesel', couleur: 'Rouge / blanc', cv: '8' },
      lines: [
        { id: 'a', kind: 'vehicule', label: 'Volkswagen T6.1 California Ocean', detail: 'Véhicule d’occasion, garantie 12 mois', qty: '1', price: '58900', vat: 'marge' },
        { id: 'b', kind: 'piece', label: 'Store latéral 2,60 m', qty: '1', price: '890', vat: '20' },
        { id: 'c', kind: 'reprise', label: 'Reprise de votre véhicule', detail: 'Volkswagen T5 Multivan', qty: '1', price: '15000', vat: '0' },
      ],
      deposit: '3000', conditions: S.settings.mentions.facture, notes: '',
    };
  }

  async function doImport(file) {
    let o;
    try { o = JSON.parse(await file.text()); } catch (e) { toast('Ce fichier n’est pas une sauvegarde valide.'); return; }
    if (!o || o.app !== 'speedski-gestion') { toast('Ce fichier n’est pas une sauvegarde Speedski.'); return; }
    const nd = (o.docs || []).length, nc = (o.clients || []).length;
    const a = await ask({ title: 'Importer la sauvegarde ?', text: `${nd} document${nd > 1 ? 's' : ''} et ${nc} client${nc > 1 ? 's' : ''}. Les documents déjà présents sont conservés ; ceux qui portent le même identifiant sont remplacés.`, ok: 'Importer' });
    if (a !== 'ok') return;
    if (o.settings) S.settings = mergeSettings(o.settings);
    (o.docs || []).forEach((d) => d && d.id && S.docs.set(d.id, d));
    (o.clients || []).forEach((c) => c && c.id && S.clients.set(c.id, c));
    persistLocal();
    if (S.mode === 'db') {
      await dbSet('settings', clone(S.settings));
      for (const d of o.docs || []) if (d && d.id) await dbSet('d-' + d.id, clone(d));
      for (const c of o.clients || []) if (c && c.id) await dbSet('c-' + c.id, clone(c));
    }
    renderView();
    toast('Sauvegarde importée');
  }

  /* ---------- Événements ---------- */
  document.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-act]');
    if (!a || a.closest('#editor') || a.closest('#sheet')) return;
    const act = a.dataset.act;
    if (act === 'new') openEditor(newDoc(a.dataset.type), true);
    else if (act === 'pick-new') pickType('Nouveau document', (t) => openEditor(newDoc(t), true));
    else if (act === 'open-doc') { const d = S.docs.get(a.dataset.id); if (d) openEditor(clone(d), false); }
    else if (act === 'go') location.hash = a.dataset.route;
    else if (act === 'filter') { UI.filter = a.dataset.v; renderView(); }
    else if (act === 'open-client') { const c = S.clients.get(a.dataset.id); if (c) openClient(clone(c), false); }
    else if (act === 'new-client') openClient({ id: uid(), createdAt: Date.now() }, true);
    else if (act === 'set') { setPath(S.settings, a.dataset.s, a.dataset.v); saveSettings(); renderView(); }
    else if (act === 'sample-pdf') makePDF(sampleDoc(), { sample: true });
    else if (act === 'export') {
      const data = JSON.stringify({ app: 'speedski-gestion', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, docs: [...S.docs.values()], clients: [...S.clients.values()] }, null, 1);
      offerFile(`speedski-sauvegarde-${todayISO()}.json`, data, 'Sauvegarde enregistrée');
    }
    else if (act === 'import') { const i = $('#import-file'); if (i) { i.value = ''; i.click(); } }
    else if (act === 'export-xlsx') {
      const docs = filteredDocs();
      if (!docs.length) { toast('Aucun document dans cette liste'); return; }
      const label = UI.filter === 'all' ? '' : ' ' + ({ due: 'à encaisser' }[UI.filter] || TYPES[UI.filter].label.toLowerCase());
      offerFile(`Registre Speedski${label} ${todayISO()}.xlsx`, new Blob([buildRegisterXlsx(docs, S.settings)]), 'Tableau enregistré');
    }
  });
  let settingsTimer = null;
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest('#editor')) return;
    if (t.id === 'doc-q') {
      UI.q = t.value;
      const tmp = document.createElement('div'); tmp.innerHTML = viewDocs();
      $('#doc-results').innerHTML = $('#doc-results', tmp).innerHTML;
    } else if (t.id === 'client-q') {
      UI.cq = t.value;
      const tmp = document.createElement('div'); tmp.innerHTML = viewClients();
      $('#client-results').innerHTML = $('#client-results', tmp).innerHTML;
    } else if (t.dataset.s) {
      setPath(S.settings, t.dataset.s, t.type === 'checkbox' ? t.checked : t.value);
      const mm = t.dataset.s.match(/^numbering\.(\w+)\.next$/);
      if (mm) S.settings.numbering[mm[1]].year = new Date().getFullYear();
      $$('[data-peek]').forEach((el) => { el.textContent = peekNumber(S.settings, el.dataset.peek).text; });
      clearTimeout(settingsTimer);
      settingsTimer = setTimeout(saveSettings, 500);
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) doImport(e.target.files[0]);
  });

  function bindEditor(el) {
    el.addEventListener('toggle', (e) => { if (e.target.tagName === 'DETAILS') ED.vOpen = e.target.open; }, true);
    el.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-act]');
      if (!a) { if (ED.suggest && !e.target.closest('.suggest')) { ED.suggest = false; refreshClient(); } return; }
      const d = ED.doc; const act = a.dataset.act;
      if (act === 'ed-back') tryBack();
      else if (act === 'ed-save') saveEditor();
      else if (act === 'ed-pdf') { saveEditor(true); makePDF(clone(ED.doc)); }
      else if (act === 'ed-status') {
        d.status = a.dataset.v;
        if (d.status === 'payee' && !d.paidDate) d.paidDate = todayISO();
        renderEditor();
      }
      else if (act === 'add-line') {
        d.lines.push(newLine(a.dataset.kind, d)); renderEditor();
        const last = $$('#ed-lines .line').pop();
        if (last) { const i = $('[data-l="label"]', last); last.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (i && !i.value) setTimeout(() => i.focus({ preventScroll: true }), 250); }
      }
      else if (act === 'del-line') {
        const id = a.closest('[data-line]').dataset.line;
        d.lines = d.lines.filter((l) => l.id !== id); renderEditor();
      }
      else if (act === 'pick-client') {
        const c = S.clients.get(a.dataset.id); if (!c) return;
        d.client = { name: c.name || '', address: c.address || '', zip: c.zip || '', city: c.city || '', phone: c.phone || '', email: c.email || '', vatNo: c.vatNo || '', idDoc: c.idDoc || '' };
        d.clientId = c.id; ED.suggest = false; refreshClient();
      }
      else if (act === 'ed-xlsx') {
        if (dirty()) saveEditor(true);
        const dd = clone(ED.doc);
        offerFile(pdfFileName(dd).replace(/\.pdf$/, '.xlsx'), new Blob([buildDocXlsx(dd, S.settings)]), 'Tableau enregistré');
      }
      else if (act === 'sign') openSignature();
      else if (act === 'sign-clear') { d.signature = ''; d.signedAt = ''; renderEditor(); }
      else if (act === 'duplicate') {
        if (dirty()) saveEditor(true);
        const src = ED.doc;
        const copy = newDoc(src.type, { client: clone(src.client), clientId: src.clientId, vehicle: clone(src.vehicle), lines: clone(src.lines).map((l) => Object.assign(l, { id: uid() })), notes: src.notes, conditions: src.conditions, payMode: src.payMode });
        openEditor(copy, true);
        toast('Copie créée : enregistrez pour lui donner un numéro');
      }
      else if (act === 'convert') {
        if (dirty()) saveEditor(true);
        const src = ED.doc, target = a.dataset.type;
        if (src.type === 'devis' && src.status === 'attente') { src.status = 'accepte'; saveDocRec(clone(src)); }
        const nd = newDoc(target, { client: clone(src.client), clientId: src.clientId, vehicle: clone(src.vehicle), lines: clone(src.lines).map((l) => Object.assign(l, { id: uid() })), notes: src.notes, payMode: src.payMode, deposit: TYPES[target].deposit ? src.deposit || '' : '', ref: src.number, sourceId: src.id, sourceNo: src.number });
        openEditor(nd, true);
        toast(`${TYPES[target].label} préparé à partir de ${src.number}`);
      }
      else if (act === 'delete') {
        const inv = INVOICE_TYPES.includes(d.type);
        const r = await ask({ title: `Supprimer ${d.number} ?`, text: inv ? 'Une facture émise ne doit normalement pas être supprimée : en cas d’erreur, faites plutôt une nouvelle facture rectificative. Supprimer quand même ?' : 'Le document sera définitivement supprimé.', ok: 'Supprimer', danger: true });
        if (r === 'ok') { deleteDocRec(d.id); closeEditor(); toast('Document supprimé'); }
      }
    });
    el.addEventListener('input', (e) => {
      const t = e.target, d = ED.doc; if (!d) return;
      if (t.dataset.f) {
        setPath(d, t.dataset.f, t.value);
        if (t.dataset.f === 'client.name') {
          d.clientId = d.clientId && S.clients.get(d.clientId) && S.clients.get(d.clientId).name === t.value ? d.clientId : '';
          ED.suggest = true; refreshSuggest();
        }
        if (t.dataset.f === 'deposit') updateLive();
      } else if (t.dataset.l) {
        const row = t.closest('[data-line]');
        const l = d.lines.find((x) => x.id === row.dataset.line); if (!l) return;
        l[t.dataset.l] = t.value;
        if (t.dataset.l === 'detail') { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
        $('[data-amt]', row).textContent = fmtMoney(lineAmount(l));
        $('[data-note]', row).textContent = lineNote(l);
        updateLive();
      }
    });
    el.addEventListener('change', (e) => {
      const t = e.target, d = ED.doc; if (!d) return;
      if (t.dataset.l === 'vat') { renderEditor(); return; }
      const f = t.dataset.f;
      if (f === 'vehicle.immat') {
        let v = t.value.toUpperCase().replace(/\s+/g, '');
        const m = v.replace(/-/g, '').match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/);
        if (m) v = `${m[1]}-${m[2]}-${m[3]}`;
        d.vehicle.immat = v; t.value = v;
      }
      if (f === 'vehicle.vin') { d.vehicle.vin = t.value.toUpperCase().replace(/\s+/g, ''); t.value = d.vehicle.vin; }
      if (f === 'vehicle.modele') {
        const vl = d.lines.find((l) => l.kind === 'vehicule' && !l.label.trim());
        if (vl && d.type !== 'achat') { vl.label = t.value; renderEditor(); }
        const sum = t.closest('details') && $('.sum', t.closest('details')); if (sum) sum.textContent = vehicleSummary(d.vehicle);
      }
      if (f === 'date' && ED.isNew) {
        if (d.type === 'devis') d.validUntil = addDaysISO(d.date, S.settings.defaults.devisDays || 30);
        if (INVOICE_TYPES.includes(d.type)) d.dueDate = addDaysISO(d.date, S.settings.defaults.dueDays || 0);
        renderEditor();
      }
    });
  }
  function refreshSuggest() {
    const wrap = $('#ed-client .suggest'); if (!wrap) return;
    const old = $('.suggest-list', wrap); if (old) old.remove();
    const m = suggestions();
    if (!ED.suggest || !m.length) return;
    const div = document.createElement('div'); div.className = 'suggest-list';
    div.innerHTML = m.map((c) => `<button data-act="pick-client" data-id="${esc(c.id)}">${esc(c.name)}<small>${esc([c.city, c.phone].filter(Boolean).join(' · '))}</small></button>`).join('');
    wrap.appendChild(div);
  }
  function refreshClient() {
    const box = $('#ed-client'); if (!box) return;
    box.innerHTML = `<h2>${TYPES[ED.doc.type].party}</h2>${clientFields()}`;
  }

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S') && ED.doc) { e.preventDefault(); saveEditor(); return; }
    if (e.key === 'Escape') {
      const s = $('#sheet');
      if (s) { if (!s.dataset.locked) closeSheet(); }
      else if (ED.doc && !(e.target && e.target.closest && e.target.closest('.suggest') && ED.suggest)) tryBack();
      else if (ED.suggest) { ED.suggest = false; refreshClient(); }
    }
  });
  const sideLogo = $('.side-brand img'); if (sideLogo) sideLogo.src = LOGO;

  window.addEventListener('hashchange', () => {
    const r = (location.hash || '').slice(1);
    UI.route = ['documents', 'clients', 'reglages'].includes(r) ? r : 'accueil';
    renderView();
    window.scrollTo(0, 0);
  });

  /* ---------- Démarrage ---------- */
  loadLocal();
  const r0 = (location.hash || '').slice(1);
  UI.route = ['documents', 'clients', 'reglages'].includes(r0) ? r0 : 'accueil';
  renderView();
  initDb();
  if (!IN_CLAUDE) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* facultatif */ }
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();

</script>
</body>
</html>
